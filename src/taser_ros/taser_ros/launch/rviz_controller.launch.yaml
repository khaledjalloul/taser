launch:
  - include:
      file: $(find-pkg-share taser_ros)/launch/rviz.launch.yaml
      arg:
        - name: use_joint_state_publisher_gui
          value: "false"

  - node:
      pkg: taser_ros
      exec: controller_node
      output: screen
      param:
        - from: $(find-pkg-share taser_ros)/config/controller.yaml
