    # isaac_usd_path: "/Isaac/Robots/m445/m445.usd"
    urdf_path: "/workspace/taser/src/taser/common/model/urdf/taser.urdf"
    # Path to meshes
    asset_root_path: "/workspace/taser/src/taser/common/model/urdf"
    # Path to this config file
    external_robot_configs_path: /workspace/taser/src/taser_training/curobo/data_collection/config

    # Robot configuration
    base_link: "base_link"
    ee_link: "left_arm_eef"
